
debug = 0
verbose = 0
generate = 1
# bind: listening address, "*" (default) means all IPv4 and IPv6 addresses;
# an IPv6 literal is written in brackets: bind = [::1]
#bind = 127.0.0.1
#btcnode = 127.0.0.1:8333
peer = seed.qbitcoin.net
# hidden-peer: never advertise this peer to others (and hide it as block/tx origin).
# This alone does NOT make us connect to it; to also connect, list the same address under "peer".
#hidden_peer = 10.0.0.2
# pinned-only: make outgoing connections only to the peers explicitly listed under "peer"
# (no seed/fallback peers, no peers learned from the network), do not request or store
# other nodes' addresses, and advertise port 0 so that remote nodes do not announce us.
# For a hidden (non-public) node; note that the pinned peers still see our address and
# relay our blocks/transactions with it as origin unless they mark us as their hidden-peer.
#pinned_only = 1
# hostname: the DNS name of this node, announced to peers in the greeting and shown in
# their "getpeerinfo" output. Purely informational; the peers mark it "verified" if it
# resolves to this node's address. Not announced when unset (do not leak internal names).
#hostname = node1.example.com
dbi = sqlite
database = /var/lib/qbitcoin/qbitcoin.sqlite
# db_pool_size: limit for the database connections kept open in advance and lent to the
# forked read-only RPC/REST request handlers, so that a handler does not spend time
# connecting to the database server. Connections are opened only as the request rate
# needs them and are released after 5 minutes without use, so an idle node keeps none.
# Defaults to "max_fork_children" (8); set to 0 to disable and let every request handler
# open its own connection. Ignored for sqlite.
#db_pool_size = 8
# encrypted_private_keys: encrypt the wallet private keys in the database with
# the wallet password (applied by "setwalletpassword", which also decrypts the
# keys back when this is disabled). With encrypted keys the node starts locked:
# staking is paused until "qbitcoin-cli walletunlock" or the staking toggle in
# the web admin interface. Disable to let staking survive a node restart while
# still protecting the REST API with the password. Enabled by default.
#encrypted_private_keys = 0
# allow_password_reset: allow the "setwalletpassword" RPC to reset a FORGOTTEN
# wallet password (changing the password with the current one known is always
# allowed). The reset PERMANENTLY DESTROYS all encrypted private keys - they
# cannot be decrypted without the old password - so it asks for an explicit
# confirmation. Disabled by default; uncomment to allow recovery via local RPC.
#allow_password_reset = 1
# accept_delegations: register delegated-staking addresses found in the chain, with
# no request to this node. The coins owner funds the covenant address (built from
# their own key and this node's staking pubkeyhash) with an output whose data field
# is "D" followed by the owner pubkeyhash; when the address matches one of the wallet
# staking keys, the node starts staking it. The address commits to both keys, so such
# an output is the owner's intent by itself. To stop the staking the owner just
# publishes a transaction spending the coins: an output spent in the mempool is not
# staked, even while the transaction waits for the stake maturity. Disabled by
# default; the manual "adddelegationaddress" flow works regardless of this option.
#accept_delegations = 1
# min_delegation: the minimum value (coins) of the output registering a delegation;
# smaller outputs are ignored, so that dust cannot fill the delegation table.
# Default 1.
#min_delegation = 1
# max_delegations: the most delegated-staking addresses registered from the chain;
# further registrations are ignored until the cleanup frees a slot. Unlimited by default.
#max_delegations = 1000
# delegation_expire: days after which a delegated-staking address with no coins on it
# (spent away by the owner, or never funded) is removed from the node; a funded mark
# or adddelegationaddress registers it again. Default 30.
#delegation_expire = 30
# max_stake_inputs: the most UTXO spent by one stake transaction. A node staking
# many (delegated) addresses takes the heaviest UTXO (value * age) first; a small
# UTXO gets its turn when its age outweighs the big ones renewed in every block.
# Unlimited by default, the transaction size limit still applies.
#max_stake_inputs = 500
log = syslog
loglevel = info

